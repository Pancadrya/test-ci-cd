# docker-compose.yml
version: "3.8"
services:
  database:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: pocdb

  backend:
    build: ./backend
    ports:
      - "3000:3000"

  frontend:
    image: nginx:1.19-alpine # Sengaja pakai versi usang
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
