name: DevSecOps CI Pipeline

on:
  pull_request:
    branches: ["staging", "main"]
  push:
    branches: ["staging", "main", "chore/linux-vps-runner"]

jobs:
  security-and-lint:
    name: Source Code Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Penting untuk Gitleaks agar bisa membaca history commit

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Filesystem Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          trivyignores: ".trivyignore"

  unit-test:
    name: Unit Test & Coverage
    needs: security-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Jest with Coverage
        working-directory: ./backend
        run: npm test

  build-and-scan-image:
    name: Build and Scan Docker Image
    needs: unit-test
    runs-on: [self-hosted, lci-dev-server]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- BACKEND ---
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: poc-backend:local

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true # Tetap dipertahankan untuk jaga-jaga koneksi VPS
        with:
          image-ref: "poc-backend:local"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          timeout: "30m"

      # --- FRONTEND (MULTI-STAGE) ---
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          tags: poc-frontend:local

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: "poc-frontend:local"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          timeout: "30m"

  deploy:
    name: Deploy to Local Staging
    needs: build-and-scan-image # Kunci CD: Hanya berjalan jika Gitleaks, Jest, dan Trivy lolos (Succeeded)
    runs-on: [self-hosted, lci-dev-server]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Application via Docker Compose
        run: |
          docker compose down
          docker compose up -d --build
